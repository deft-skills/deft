  refinements:
  - kind: overrides
    target: gap-0
    content: |-
      ## Checklist Purpose: "Unit Tests for English"

      **CRITICAL CONCEPT**: Checklists are **UNIT TESTS FOR REQUIREMENTS WRITING** - they validate the quality, clarity, and completeness of requirements in a given domain.

      **NOT for verification/testing**:

      - ❌ NOT "Verify the button clicks correctly"
      - ❌ NOT "Test error handling works"
      - ❌ NOT "Confirm the API returns 200"
      - ❌ NOT checking if code/implementation matches the spec

      **FOR requirements quality validation**:

      - ✅ "Are visual hierarchy requirements defined for all card types?" (completeness)
      - ✅ "Is 'prominent display' quantified with specific sizing/positioning?" (clarity)
      - ✅ "Are hover state requirements consistent across all interactive elements?" (consistency)
      - ✅ "Are accessibility requirements defined for keyboard navigation?" (coverage)
      - ✅ "Does the spec define what happens when logo image fails to load?" (edge cases)

      **Metaphor**: If your spec is code written in English, the checklist is its unit test suite. You're testing whether the requirements are well-written, complete, unambiguous, and ready for implementation - NOT whether the implementation works.

      **Ownership and checkbox lifecycle**:

      - Custom checklists generated by this command are reviewer-owned requirements-quality review artifacts.
      - `[x]` means the reviewer determined the requirements-quality criterion is satisfied.
      - `[x]` does NOT mean implementation work is complete.
      - This command generates or appends checklist items; it MUST NOT mark generated items `[x]`.
      - An agent may assist with evaluating items only when explicitly asked by the reviewer.
      - `checklists/requirements.md` is a separate built-in spec-quality checklist maintained by `__SPECKIT_COMMAND_SPECIFY__` and `__SPECKIT_COMMAND_CLARIFY__`; do not treat that exception as applying to custom checklists generated here.
  - kind: implements
    target: body
    content: |-
      ## Execution Steps

      1. **Setup**: Run `{SCRIPT}` from repo root and parse JSON for FEATURE_DIR, AVAILABLE_DOCS list, and TEMPLATE_CONTENT.
         - All file paths must be absolute.
         - For single quotes in args like "I'm Groot", use escape syntax: e.g 'I'\''m Groot' (or double-quote if possible: "I'm Groot").

      2. **IF EXISTS**: Load `/memory/constitution.md` for project principles and governance constraints.

      3. **Clarify intent (dynamic)**: Derive up to THREE initial contextual clarifying questions (no pre-baked catalog). They MUST:
         - Be generated from the user's phrasing + extracted signals from spec/plan/tasks
         - Only ask about information that materially changes checklist content
         - Be skipped individually if already unambiguous in `$ARGUMENTS`
         - Prefer precision over breadth

         Generation algorithm:
         1. Extract signals: feature domain keywords (e.g., auth, latency, UX, API), risk indicators ("critical", "must", "compliance"), stakeholder hints ("QA", "review", "security team"), and explicit deliverables ("a11y", "rollback", "contracts").
         2. Cluster signals into candidate focus areas (max 4) ranked by relevance.
         3. Identify probable audience & timing (author, reviewer, QA, release) if not explicit.
         4. Detect missing dimensions: scope breadth, depth/rigor, risk emphasis, exclusion boundaries, measurable acceptance criteria.
         5. Formulate questions chosen from these archetypes:
            - Scope refinement (e.g., "Should this include integration touchpoints with X and Y or stay limited to local module correctness?")
            - Risk prioritization (e.g., "Which of these potential risk areas should receive mandatory gating checks?")
            - Depth calibration (e.g., "Is this a lightweight pre-commit sanity list or a formal release gate?")
            - Audience framing (e.g., "Will this be used by the author only or peers during PR review?")
            - Boundary exclusion (e.g., "Should we explicitly exclude performance tuning items this round?")
            - Scenario class gap (e.g., "No recovery flows detected—are rollback / partial failure paths in scope?")

         Question formatting rules:
         - If presenting options, generate a compact table with columns: Option | Candidate | Why It Matters
         - Limit to A–E options maximum; omit table if a free-form answer is clearer
         - Never ask the user to restate what they already said
         - Avoid speculative categories (no hallucination). If uncertain, ask explicitly: "Confirm whether X belongs in scope."

         Defaults when interaction impossible:
         - Depth: Standard
         - Audience: Reviewer (PR) if code-related; Author otherwise
         - Focus: Top 2 relevance clusters

         Output the questions (label Q1/Q2/Q3). After answers: if ≥2 scenario classes (Alternate / Exception / Recovery / Non-Functional domain) remain unclear, you MAY ask up to TWO more targeted follow‑ups (Q4/Q5) with a one-line justification each (e.g., "Unresolved recovery path risk"). Do not exceed five total questions. Skip escalation if user explicitly declines more.

      4. **Understand user request**: Combine `$ARGUMENTS` + clarifying answers:
         - Derive checklist theme (e.g., security, review, deploy, ux)
         - Consolidate explicit must-have items mentioned by user
         - Map focus selections to category scaffolding
         - Infer any missing context from spec/plan/tasks (do NOT hallucinate)

      5. **Load feature context**: Read from FEATURE_DIR:
         - spec.md: Feature requirements and scope
         - plan.md (if exists): Technical details, dependencies
         - tasks.md (if exists): Implementation tasks

         **Context Loading Strategy**:
         - Load only necessary portions relevant to active focus areas (avoid full-file dumping)
         - Prefer summarizing long sections into concise scenario/requirement bullets
         - Use progressive disclosure: add follow-on retrieval only if gaps detected
         - If source docs are large, generate interim summary items instead of embedding raw text

      6. **Generate checklist** - Use TEMPLATE_CONTENT as the structural template and create "Unit Tests for Requirements":
         - Create `FEATURE_DIR/checklists/` directory if it doesn't exist
         - Generate unique checklist filename:
           - Use short, descriptive name based on domain (e.g., `ux.md`, `api.md`, `security.md`)
           - Format: `[domain].md`
         - File handling behavior:
           - If file does NOT exist: Create new file and number items starting from CHK001
           - If file exists: Append new items to existing file, continuing from the last CHK ID (e.g., if last item is CHK015, start new items at CHK016)
         - Never delete or replace existing checklist content - always preserve and append
         - Leave every newly generated item unchecked (`[ ]`); checkbox state belongs to the reviewer

         **CORE PRINCIPLE - Test the Requirements, Not the Implementation**:
         Every checklist item MUST evaluate the REQUIREMENTS THEMSELVES for:
         - **Completeness**: Are all necessary requirements present?
         - **Clarity**: Are requirements unambiguous and specific?
         - **Consistency**: Do requirements align with each other?
         - **Measurability**: Can requirements be objectively verified?
         - **Coverage**: Are all scenarios/edge cases addressed?

         **Category Structure** - Group items by requirement quality dimensions:
         - **Requirement Completeness** (Are all necessary requirements documented?)
         - **Requirement Clarity** (Are requirements specific and unambiguous?)
         - **Requirement Consistency** (Do requirements align without conflicts?)
         - **Acceptance Criteria Quality** (Are success criteria measurable?)
         - **Scenario Coverage** (Are all flows/cases addressed?)
         - **Edge Case Coverage** (Are boundary conditions defined?)
         - **Non-Functional Requirements** (Performance, Security, Accessibility, etc. - are they specified?)
         - **Dependencies & Assumptions** (Are they documented and validated?)
         - **Ambiguities & Conflicts** (What needs clarification?)

         **HOW TO WRITE CHECKLIST ITEMS - "Unit Tests for English"**:

         ❌ **WRONG** (Testing implementation):
         - "Verify landing page displays 3 episode cards"
         - "Test hover states work on desktop"
         - "Confirm logo click navigates home"

         ✅ **CORRECT** (Testing requirements quality):
         - "Are the exact number and layout of featured episodes specified?" [Completeness]
         - "Is 'prominent display' quantified with specific sizing/positioning?" [Clarity]
         - "Are hover state requirements consistent across all interactive elements?" [Consistency]
         - "Are keyboard navigation requirements defined for all interactive UI?" [Coverage]
         - "Is the fallback behavior specified when logo image fails to load?" [Edge Cases]
         - "Are loading states defined for asynchronous episode data?" [Completeness]
         - "Does the spec define visual hierarchy for competing UI elements?" [Clarity]

         **ITEM STRUCTURE**:
         Each item should follow this pattern:
         - Question format asking about requirement quality
         - Focus on what's WRITTEN (or not written) in the spec/plan
         - Include quality dimension in brackets [Completeness/Clarity/Consistency/etc.]
         - Reference spec section `[Spec §X.Y]` when checking existing requirements
         - Use `[Gap]` marker when checking for missing requirements

         **EXAMPLES BY QUALITY DIMENSION**:

         Completeness:
         - "Are error handling requirements defined for all API failure modes? [Gap]"
         - "Are accessibility requirements specified for all interactive elements? [Completeness]"
         - "Are mobile breakpoint requirements defined for responsive layouts? [Gap]"

         Clarity:
         - "Is 'fast loading' quantified with specific timing thresholds? [Clarity, Spec §NFR-2]"
         - "Are 'related episodes' selection criteria explicitly defined? [Clarity, Spec §FR-5]"
         - "Is 'prominent' defined with measurable visual properties? [Ambiguity, Spec §FR-4]"

         Consistency:
         - "Do navigation requirements align across all pages? [Consistency, Spec §FR-10]"
         - "Are card component requirements consistent between landing and detail pages? [Consistency]"

         Coverage:
         - "Are requirements defined for zero-state scenarios (no episodes)? [Coverage, Edge Case]"
         - "Are concurrent user interaction scenarios addressed? [Coverage, Gap]"
         - "Are requirements specified for partial data loading failures? [Coverage, Exception Flow]"

         Measurability:
         - "Are visual hierarchy requirements measurable/testable? [Acceptance Criteria, Spec §FR-1]"
         - "Can 'balanced visual weight' be objectively verified? [Measurability, Spec §FR-2]"

         **Scenario Classification & Coverage** (Requirements Quality Focus):
         - Check if requirements exist for: Primary, Alternate, Exception/Error, Recovery, Non-Functional scenarios
         - For each scenario class, ask: "Are [scenario type] requirements complete, clear, and consistent?"
         - If scenario class missing: "Are [scenario type] requirements intentionally excluded or missing? [Gap]"
         - Include resilience/rollback when state mutation occurs: "Are rollback requirements defined for migration failures? [Gap]"

         **Traceability Requirements**:
         - MINIMUM: ≥80% of items MUST include at least one traceability reference
         - Each item should reference: spec section `[Spec §X.Y]`, or use markers: `[Gap]`, `[Ambiguity]`, `[Conflict]`, `[Assumption]`
         - If no ID system exists: "Is a requirement & acceptance criteria ID scheme established? [Traceability]"

         **Surface & Resolve Issues** (Requirements Quality Problems):
         Ask questions about the requirements themselves:
         - Ambiguities: "Is the term 'fast' quantified with specific metrics? [Ambiguity, Spec §NFR-1]"
         - Conflicts: "Do navigation requirements conflict between §FR-10 and §FR-10a? [Conflict]"
         - Assumptions: "Is the assumption of 'always available podcast API' validated? [Assumption]"
         - Dependencies: "Are external podcast API requirements documented? [Dependency, Gap]"
         - Missing definitions: "Is 'visual hierarchy' defined with measurable criteria? [Gap]"

         **Content Consolidation**:
         - Soft cap: If raw candidate items > 40, prioritize by risk/impact
         - Merge near-duplicates checking the same requirement aspect
         - If >5 low-impact edge cases, create one item: "Are edge cases X, Y, Z addressed in requirements? [Coverage]"

         **🚫 ABSOLUTELY PROHIBITED** - These make it an implementation test, not a requirements test:
         - ❌ Any item starting with "Verify", "Test", "Confirm", "Check" + implementation behavior
         - ❌ References to code execution, user actions, system behavior
         - ❌ "Displays correctly", "works properly", "functions as expected"
         - ❌ "Click", "navigate", "render", "load", "execute"
         - ❌ Test cases, test plans, QA procedures
         - ❌ Implementation details (frameworks, APIs, algorithms)

         **✅ REQUIRED PATTERNS** - These test requirements quality:
         - ✅ "Are [requirement type] defined/specified/documented for [scenario]?"
         - ✅ "Is [vague term] quantified/clarified with specific criteria?"
         - ✅ "Are requirements consistent between [section A] and [section B]?"
         - ✅ "Can [requirement] be objectively measured/verified?"
         - ✅ "Are [edge cases/scenarios] addressed in requirements?"
         - ✅ "Does the spec define [missing aspect]?"

      7. **Structure Reference**: Generate the checklist following the canonical template in `templates/checklist-template.md` for title, meta section, category headings, ownership note, notes section, and ID formatting. If template is unavailable, use: H1 title, purpose/created meta lines, an ownership note explaining that `[x]` means reviewer approval of requirements quality, `##` category sections containing `- [ ] CHK### <requirement item>` lines with globally incrementing IDs starting at CHK001, and notes that `__SPECKIT_COMMAND_IMPLEMENT__` reads checklist state but does not modify markers.

      8. **Report**: Output full path to checklist file, item count, and summarize whether the run created a new file or appended to an existing one. Summarize:
         - Focus areas selected
         - Depth level
         - Actor/timing
         - Any explicit user-specified must-have items incorporated

      **Important**: Each `__SPECKIT_COMMAND_CHECKLIST__` command invocation uses a short, descriptive checklist filename and either creates a new file or appends to an existing one. This allows:

      - Multiple checklists of different types (e.g., `ux.md`, `test.md`, `security.md`)
      - Simple, memorable filenames that indicate checklist purpose
      - Easy identification and navigation in the `checklists/` folder

      To avoid clutter, use descriptive types and clean up obsolete checklists when done.

      ## Example Checklist Types & Sample Items

      **UX Requirements Quality:** `ux.md`

      Sample items (testing the requirements, NOT the implementation):

      - "Are visual hierarchy requirements defined with measurable criteria? [Clarity, Spec §FR-1]"
      - "Is the number and positioning of UI elements explicitly specified? [Completeness, Spec §FR-1]"
      - "Are interaction state requirements (hover, focus, active) consistently defined? [Consistency]"
      - "Are accessibility requirements specified for all interactive elements? [Coverage, Gap]"
      - "Is fallback behavior defined when images fail to load? [Edge Case, Gap]"
      - "Can 'prominent display' be objectively measured? [Measurability, Spec §FR-4]"

      **API Requirements Quality:** `api.md`

      Sample items:

      - "Are error response formats specified for all failure scenarios? [Completeness]"
      - "Are rate limiting requirements quantified with specific thresholds? [Clarity]"
      - "Are authentication requirements consistent across all endpoints? [Consistency]"
      - "Are retry/timeout requirements defined for external dependencies? [Coverage, Gap]"
      - "Is versioning strategy documented in requirements? [Gap]"

      **Performance Requirements Quality:** `performance.md`

      Sample items:

      - "Are performance requirements quantified with specific metrics? [Clarity]"
      - "Are performance targets defined for all critical user journeys? [Coverage]"
      - "Are performance requirements under different load conditions specified? [Completeness]"
      - "Can performance requirements be objectively measured? [Measurability]"
      - "Are degradation requirements defined for high-load scenarios? [Edge Case, Gap]"

      **Security Requirements Quality:** `security.md`

      Sample items:

      - "Are authentication requirements specified for all protected resources? [Coverage]"
      - "Are data protection requirements defined for sensitive information? [Completeness]"
      - "Is the threat model documented and requirements aligned to it? [Traceability]"
      - "Are security requirements consistent with compliance obligations? [Consistency]"
      - "Are security failure/breach response requirements defined? [Gap, Exception Flow]"

      ## Anti-Examples: What NOT To Do

      **❌ WRONG - These test implementation, not requirements:**

      ```markdown
      - [ ] CHK001 - Verify landing page displays 3 episode cards [Spec §FR-001]
      - [ ] CHK002 - Test hover states work correctly on desktop [Spec §FR-003]
      - [ ] CHK003 - Confirm logo click navigates to home page [Spec §FR-010]
      - [ ] CHK004 - Check that related episodes section shows 3-5 items [Spec §FR-005]
      ```

      **✅ CORRECT - These test requirements quality:**

      ```markdown
      - [ ] CHK001 - Are the number and layout of featured episodes explicitly specified? [Completeness, Spec §FR-001]
      - [ ] CHK002 - Are hover state requirements consistently defined for all interactive elements? [Consistency, Spec §FR-003]
      - [ ] CHK003 - Are navigation requirements clear for all clickable brand elements? [Clarity, Spec §FR-010]
      - [ ] CHK004 - Is the selection criteria for related episodes documented? [Gap, Spec §FR-005]
      - [ ] CHK005 - Are loading state requirements defined for asynchronous episode data? [Gap]
      - [ ] CHK006 - Can "visual hierarchy" requirements be objectively measured? [Measurability, Spec §FR-001]
      ```

      **Key Differences:**

      - Wrong: Tests if the system works correctly
      - Correct: Tests if the requirements are written correctly
      - Wrong: Verification of behavior
      - Correct: Validation of requirement quality
      - Wrong: "Does it do X?"
      - Correct: "Is X clearly specified?"
  - kind: implements
    target: closing
    content: ''
- name: clarify
  parent: speckit-with-mandatory-post-execution-hooks
  description: Identify underspecified areas in the current feature spec by asking up to 5 highly targeted clarification questions
    and encoding answers back into the spec.
  metadata:
    pre_execution_checks_0: '**Check for extension hooks (before clarification)**:'
    pre_execution_checks_2: '- If it exists, read it and look for entries under the `hooks.before_clarify` key'
    pre_execution_checks_28: '    Wait for the result of the hook command before proceeding to the Outline.'
    mandatory_post_execution_hooks_3: '- If it does not exist, or no hooks are registered under `hooks.after_clarify`, skip
      to the Completion Report.'
    mandatory_post_execution_hooks_4: '- If it exists, read it and look for entries under the `hooks.after_clarify` key.'
  refinements:
  - kind: implements
    target: body
    content: |-
      ## Outline

      Goal: Detect and reduce ambiguity or missing decision points in the active feature specification and record the clarifications directly in the spec file.

      Note: This clarification workflow is expected to run (and be completed) BEFORE invoking `__SPECKIT_COMMAND_PLAN__`. If the user explicitly states they are skipping clarification (e.g., exploratory spike), you may proceed, but must warn that downstream rework risk increases.

      Execution steps:

      1. Run `{SCRIPT}` from repo root **once** (combined `--json --paths-only` mode / `-Json -PathsOnly`). Parse minimal JSON payload fields:
         - `FEATURE_DIR`
         - `FEATURE_SPEC`
         - (Optionally capture `IMPL_PLAN`, `TASKS` for future chained flows.)
         - If JSON parsing fails, abort and instruct user to re-run `__SPECKIT_COMMAND_SPECIFY__` or verify feature branch environment.
         - For single quotes in args like "I'm Groot", use escape syntax: e.g 'I'\''m Groot' (or double-quote if possible: "I'm Groot").

      2. **IF EXISTS**: Load `/memory/constitution.md` for project principles and governance constraints.

      3. Load the current spec file. Perform a structured ambiguity & coverage scan using this taxonomy. For each category, mark status: Clear / Partial / Missing. Produce an internal coverage map used for prioritization (do not output raw map unless no questions will be asked).

         Functional Scope & Behavior:
         - Core user goals & success criteria
         - Explicit out-of-scope declarations
         - User roles / personas differentiation

         Domain & Data Model:
         - Entities, attributes, relationships
         - Identity & uniqueness rules
         - Lifecycle/state transitions
         - Data volume / scale assumptions

         Interaction & UX Flow:
         - Critical user journeys / sequences
         - Error/empty/loading states
         - Accessibility or localization notes

         Non-Functional Quality Attributes:
         - Performance (latency, throughput targets)
         - Scalability (horizontal/vertical, limits)
         - Reliability & availability (uptime, recovery expectations)
         - Observability (logging, metrics, tracing signals)
         - Security & privacy (authN/Z, data protection, threat assumptions)
         - Compliance / regulatory constraints (if any)

         Integration & External Dependencies:
         - External services/APIs and failure modes
         - Data import/export formats
         - Protocol/versioning assumptions

         Edge Cases & Failure Handling:
         - Negative scenarios
         - Rate limiting / throttling
         - Conflict resolution (e.g., concurrent edits)

         Constraints & Tradeoffs:
         - Technical constraints (language, storage, hosting)
         - Explicit tradeoffs or rejected alternatives

         Terminology & Consistency:
         - Canonical glossary terms
         - Avoided synonyms / deprecated terms

         Completion Signals:
         - Acceptance criteria testability
         - Measurable Definition of Done style indicators

         Misc / Placeholders:
         - TODO markers / unresolved decisions
         - Ambiguous adjectives ("robust", "intuitive") lacking quantification

         For each category with Partial or Missing status, add a candidate question opportunity unless:
         - Clarification would not materially change implementation or validation strategy
         - The item is specifically about implementation method, tech-stack comparison, or task breakdown (note internally)

      4. Generate (internally) a prioritized queue of candidate clarification questions (maximum 5). Do NOT output them all at once. Apply these constraints:
          - Maximum of 5 total questions across the whole session.
          - Each question must be answerable with EITHER:
             - A short multiple‑choice selection (2–5 distinct, mutually exclusive options), OR
             - A one-word / short‑phrase answer (explicitly constrain: "Answer in <=5 words").
          - Only include questions whose answers materially impact architecture, data modeling, task decomposition, test design, UX behavior, operational readiness, or compliance validation.
          - Ensure category coverage balance: attempt to cover the highest impact unresolved categories first; avoid asking two low-impact questions when a single high-impact area (e.g., security posture) is unresolved.
          - Exclude questions already answered, trivial stylistic preferences, or plan-level execution details (unless blocking correctness).
          - Favor clarifications that reduce downstream rework risk or prevent misaligned acceptance tests.
          - If more than 5 categories remain unresolved, select the top 5 by (Impact * Uncertainty) heuristic.

      5. Sequential questioning loop (interactive):
          - Present EXACTLY ONE question at a time.
          - **Question writing quality (applies to every question, MC or short-answer):**
             - Lead with `**Question:**` followed by a full interrogative that ends with `?`. The question text before the `?` must make sense on its own.
             - NEVER use a topic label, section heading, or requirement id as the question itself. For example, `Acceptance device/runtime matrix (FR-023)` is INVALID — it is a label, not a question.
             - After the `?`, the only permitted suffix is an optional parenthesized requirement/question id. Exact format: `**Question:** <interrogative>?` or `**Question:** <interrogative>? (FR-023)`. Never put the id before the `?`, and never use the id (alone or with a topic label) as the whole prompt.
             - Immediately after the question line, add one plain-language "Why it matters" sentence (the stake for acceptance or shipping) before the recommendation/options.
             - Use everyday wording; introduce jargon only if defined in the same sentence. Self-check: a reader who does not know Spec Kit must be able to answer from the Question line alone. Terse is fine; cryptic labels are not.
          - For multiple‑choice questions:
             - **Analyze all options** and determine the **most suitable option** based on:
                - Best practices for the project type
                - Common patterns in similar implementations
                - Risk reduction (security, performance, maintainability)
                - Alignment with any explicit project goals or constraints visible in the spec
             - Present your **recommended option prominently** at the top with clear reasoning (1-2 sentences explaining why this is the best choice).
             - Format as: `**Recommended:** Option [X] - <reasoning>`
             - Then render all options as a Markdown table:

             | Option | Description |
             |--------|-------------|
             | A | <Option A description> |
             | B | <Option B description> |
             | C | <Option C description> (add D/E as needed up to 5) |
             | Short | Provide a different short answer (<=5 words) (Include only if free-form alternative is appropriate) |

             - After the table, add: `You can reply with the option letter (e.g., "A"), accept the recommendation by saying "yes" or "recommended", or provide your own short answer.`
          - For short‑answer style (no meaningful discrete options):
             - Provide your **suggested answer** based on best practices and context.
             - Format as: `**Suggested:** <your proposed answer> - <brief reasoning>`
             - Then output: `Format: Short answer (<=5 words). You can accept the suggestion by saying "yes" or "suggested", or provide your own answer.`
          - After the user answers:
             - If the user replies with "yes", "recommended", or "suggested", use your previously stated recommendation/suggestion as the answer.
             - Otherwise, validate the answer maps to one option or fits the <=5 word constraint.
             - If ambiguous, ask for a quick disambiguation (count still belongs to same question; do not advance).
             - Once satisfactory, record it in working memory (do not yet write to disk) and move to the next queued question.
          - Stop asking further questions when:
             - All critical ambiguities resolved early (remaining queued items become unnecessary), OR
             - User signals completion ("done", "good", "no more"), OR
             - You reach 5 asked questions.
          - Never reveal future queued questions in advance.
          - If no valid questions exist at start, immediately report no critical ambiguities.

      6. Integration after EACH accepted answer (incremental update approach):
          - Maintain in-memory representation of the spec (loaded once at start) plus the raw file contents.
          - For the first integrated answer in this session:
             - Ensure a `## Clarifications` section exists (create it just after the highest-level contextual/overview section per the spec template if missing).
             - Under it, create (if not present) a `### Session YYYY-MM-DD` subheading for today.
          - Append a bullet line immediately after acceptance: `- Q: <question> → A: <final answer>`.
          - Then immediately apply the clarification to the most appropriate section(s):
             - Functional ambiguity → Update or add a bullet in Functional Requirements.
             - User interaction / actor distinction → Update User Stories or Actors subsection (if present) with clarified role, constraint, or scenario.
             - Data shape / entities → Update Data Model (add fields, types, relationships) preserving ordering; note added constraints succinctly.
             - Non-functional constraint → Add/modify measurable criteria in Success Criteria > Measurable Outcomes (convert vague adjective to metric or explicit target).
             - Edge case / negative flow → Add a new bullet under Edge Cases / Error Handling (or create such subsection if template provides placeholder for it).
             - Terminology conflict → Normalize term across spec; retain original only if necessary by adding `(formerly referred to as "X")` once.
          - If the clarification invalidates an earlier ambiguous statement, replace that statement instead of duplicating; leave no obsolete contradictory text.
          - Save the spec file AFTER each integration to minimize risk of context loss (atomic overwrite).
          - Preserve formatting: do not reorder unrelated sections; keep heading hierarchy intact.
          - Keep each inserted clarification minimal and testable (avoid narrative drift).

      7. Validation (performed after EACH write plus final pass):
         - Clarifications session contains exactly one bullet per accepted answer (no duplicates).
         - Total asked (accepted) questions ≤ 5.
         - Updated sections contain no lingering vague placeholders the new answer was meant to resolve.
         - No contradictory earlier statement remains (scan for now-invalid alternative choices removed).
         - Markdown structure valid; only allowed new headings: `## Clarifications`, `### Session YYYY-MM-DD`.
         - Terminology consistency: same canonical term used across all updated sections.

      8. Write the updated spec back to `FEATURE_SPEC`.

      9. **Re-validate Spec Quality Checklist** (if it exists):
         - Check if `FEATURE_DIR/checklists/requirements.md` exists.
         - If it does NOT exist, skip this step silently.
         - If it exists:
           1. Read the checklist file.
           2. Identify all GitHub task-list checkbox lines — lines matching `- [ ]`, `- [x]`, or `- [X]` (case-insensitive, tolerant of leading whitespace for nested items) outside of code fences. Ignore all other content (headings, notes, non-checkbox bullets, metadata).
           3. For each checkbox line, record its current marker state (checked or unchecked) and item text into a before-snapshot list.
           4. Re-evaluate each checkbox item against the **updated** spec (the version just saved in step 7).
           5. For each checkbox item, update only if the checked/unchecked state actually changes:
              - If the item now passes and was unchecked: change `[ ]` to `[x]`.
              - If the item now fails and was checked: change `[x]`/`[X]` to `[ ]`.
              - If the state is unchanged: leave the marker as-is (preserve existing case to avoid cosmetic diffs).
           6. Save the updated checklist file. **Only toggle the `[ ]`/`[x]` marker portion of checkbox lines whose state changed.** All other file content — headings, metadata, notes, line ordering, whitespace — must remain unchanged to avoid noisy diffs.
           7. Compare the before-snapshot with the current state to compute three lists for the Completion Report:
              - **Newly passing**: items that changed from unchecked to checked.
              - **Regressions**: items that changed from checked to unchecked.
              - **Still unchecked**: items that remain unchecked.
           8. Record the before/after pass counts as checked/total checkbox items (e.g., "12/16 → 15/16 items passing").

      Behavior rules:

      - If no meaningful ambiguities found (or all potential questions would be low-impact), respond: "No critical ambiguities detected worth formal clarification." and suggest proceeding.
      - If spec file missing, instruct user to run `__SPECKIT_COMMAND_SPECIFY__` first (do not create a new spec here).
      - Never exceed 5 total asked questions (clarification retries for a single question do not count as new questions).
      - Avoid speculative tech stack questions unless the absence blocks functional clarity.
      - Respect user early termination signals ("stop", "done", "proceed").
      - If no questions asked due to full coverage, output a compact coverage summary (all categories Clear) then suggest advancing.
      - If quota reached with unresolved high-impact categories remaining, explicitly flag them under Deferred with rationale.

      Context for prioritization: {ARGS}
  - kind: implements
    target: closing
    content: |-
      ## Completion Report

      Report completion (after questioning loop ends or early termination):
      - Number of questions asked & answered.
      - Path to updated spec.
      - Sections touched (list names).
      - Spec quality checklist status (if `FEATURE_DIR/checklists/requirements.md` was re-validated): show before/after pass counts (e.g., "Spec Quality Checklist: 12/16 → 15/16 items passing") and list any items that changed state — both newly checked (unchecked → checked) and any regressions (checked → unchecked). If any items remain unchecked, list them as areas needing attention.
      - Coverage summary table listing each taxonomy category with Status: Resolved (was Partial/Missing and addressed), Deferred (exceeds question quota, or remaining item is specifically implementation method, tech-stack comparison, or task breakdown), Clear (already sufficient), Outstanding (still Partial/Missing but low impact).
      - If any Outstanding or Deferred remain, recommend whether to proceed to `__SPECKIT_COMMAND_PLAN__` or run `__SPECKIT_COMMAND_CLARIFY__` again later post-plan.
      - Suggested next command.

      ## Done When

      - [ ] Spec ambiguities identified and clarifications integrated into spec file
      - [ ] Spec quality checklist re-validated against updated spec (if `FEATURE_DIR/checklists/requirements.md` exists)
      - [ ] Extension hooks dispatched or skipped according to the rules in Mandatory Post-Execution Hooks above
      - [ ] Completion reported to user with questions answered, sections touched, checklist status, and coverage summary
- name: constitution
  parent: speckit-with-post-execution-checks
  description: Create or update the project constitution from interactive or provided principle inputs.
  metadata:
    pre_execution_checks_0: '**Check for extension hooks (before constitution update)**:'
    pre_execution_checks_2: '- If it exists, read it and look for entries under the `hooks.before_constitution` key'
    pre_execution_checks_28: '    Wait for the result of the hook command before proceeding to the Outline.'
    post_execution_checks_0: '**Check for extension hooks (after constitution update)**:'
    post_execution_checks_2: '- If it exists, read it and look for entries under the `hooks.after_constitution` key'
  refinements:
  - kind: overrides
    target: gap-1
    content: |-
      ## Scope Guard

      This command's own work is limited to updating the project constitution itself. Dependent templates
      and commands read the constitution at runtime and are not modified here.

      - Classify every part of the user input as either constitution content or a separate,
        non-governance intent.
      - If the input includes feature implementation, code generation, refactoring, building, or
        deployment requests, you **MUST NOT** execute them. Extract them as deferred intents instead.
      - You **MUST NOT** create, modify, or delete application source files, feature routes,
        components, tests, deployment files, or other artifacts unrelated to the constitution
        workflow.
      - If it is unclear whether an instruction is constitution content, ask for clarification before
        making changes.
      - After completing the constitution update, include a `Next Actions` section for each deferred
        intent. List the original intent and suggest the appropriate follow-up Spec Kit command, such
        as `__SPECKIT_COMMAND_SPECIFY__`, without invoking it.
      - If there are no non-governance intents, omit the `Next Actions` section.
  - kind: implements
    target: body
    content: |-
      ## Outline

      You are updating the project constitution at `.specify/memory/constitution.md`. The active
      constitution scaffold is resolved at command time from `constitution-template` through the Spec Kit
      preset/template resolution stack.

      Follow this execution flow:

      1. Run `{SCRIPT}` from the repository root and parse `TEMPLATE_CONTENT` as the active template.
         - The shared resolver applies project overrides, composing preset layers, and extension layers
           before the core template fallback. It MUST succeed before continuing.
         - If it fails, stop and report the resolution error; do not continue with only one contributing
           template layer.
         - If `.specify/memory/constitution.md` exists, load it as the source of current project-specific
           values and amendments. Preserve information that is still applicable when applying the newly
           resolved scaffold.
         - If it does not exist, use the resolved template as the initial document.
         - Do not write back to any versioned template layer.
         - Identify every placeholder token of the form `[ALL_CAPS_IDENTIFIER]`.
         **IMPORTANT**: The user might require less or more principles than the ones used in the template. If a number is specified, respect that - follow the general template. You will update the doc accordingly.

      2. Collect/derive values for placeholders:
         - If user input (conversation) supplies a value, use it.
         - Otherwise infer from existing repo context (README, docs, prior constitution versions if embedded).
         - For governance dates: `RATIFICATION_DATE` is the original adoption date (if unknown ask or mark TODO), `LAST_AMENDED_DATE` is today if changes are made, otherwise keep previous.
         - `CONSTITUTION_VERSION` must increment according to semantic versioning rules:
           - MAJOR: Backward incompatible governance/principle removals or redefinitions.
           - MINOR: New principle/section added or materially expanded guidance.
           - PATCH: Clarifications, wording, typo fixes, non-semantic refinements.
         - If version bump type ambiguous, propose reasoning before finalizing.

      3. Draft the updated constitution content using the resolved template as the required structure:
         - Replace every placeholder with concrete text (no bracketed tokens left except intentionally retained template slots that the project has chosen not to define yet—explicitly justify any left).
         - Preserve heading hierarchy and comments can be removed once replaced unless they still add clarifying guidance.
         - Ensure each Principle section: succinct name line, paragraph (or bullet list) capturing non‑negotiable rules, explicit rationale if not obvious.
         - Ensure Governance section lists amendment procedure, versioning policy, and compliance review expectations.

      4. Produce a Sync Impact Report as an HTML comment at the top of the constitution file after update.
         This report is temporary scratch material for human review of the amendment, not governance
         content; it is expected to be removed before the amended constitution file is committed.
         - Version change: old → new
         - List of modified principles (old title → new title if renamed)
         - Added sections
         - Removed sections
         - Follow-up TODOs if any placeholders intentionally deferred.

      5. Validation before final output:
         - No remaining unexplained bracket tokens.
         - Version line matches report.
         - Dates ISO format YYYY-MM-DD.
         - Principles are declarative, testable, and free of vague language ("should" → replace with MUST/SHOULD rationale where appropriate).

      6. Write the completed constitution back to `.specify/memory/constitution.md` (overwrite).

      7. Output a final summary to the user with:
         - New version and bump rationale.
         - Any TODO placeholders or deferred items requiring manual follow-up.
         - Suggested commit message (e.g., `docs: amend constitution to vX.Y.Z (principle additions + governance update)`).
         - A `Next Actions` section for any deferred non-governance intents.

      Formatting & Style Requirements:

      - Use Markdown headings exactly as in the template (do not demote/promote levels).
      - Wrap long rationale lines to keep readability (<100 chars ideally) but do not hard enforce with awkward breaks.
      - Keep a single blank line between sections.
      - Avoid trailing whitespace.

      If the user supplies partial updates (e.g., only one principle revision), still perform validation and version decision steps.

      If critical info missing (e.g., ratification date truly unknown), insert `TODO(<FIELD_NAME>): explanation` and include in the Sync Impact Report under deferred items.

      Write only `.specify/memory/constitution.md`; do not create or modify template source files.
  - kind: implements
    target: closing
    content: ''
- name: converge
  parent: speckit-command
  description: Assess the current codebase against the feature's spec, plan, and tasks, then append any remaining unbuilt
    work as new tasks to tasks.md so implement can complete it.
  metadata: {}
  refinements:
  - kind: implements
    target: body
    content: |-
      ## Goal

      Close the gap between what a feature's specification, plan, and tasks call for and what the
      codebase currently implements. Read `spec.md`, `plan.md`, and `tasks.md` as the **sole
      source of intent** (with the constitution as governing constraints), assess the current
      state of the code, determine which requirements, acceptance criteria, plan decisions, and
      existing tasks are unmet, incomplete, or only partially satisfied, and **append each piece
      of remaining work as a new, traceable task** at the bottom of `tasks.md` so that
      `__SPECKIT_COMMAND_IMPLEMENT__` can complete it. This command MUST run only after
      `__SPECKIT_COMMAND_IMPLEMENT__` has run on the current `tasks.md`, and after `__SPECKIT_COMMAND_TASKS__` has produced a complete `tasks.md`.

      This is **not** a diff tool and does **not** track changes. It assesses the present state
      of the code relative to the feature's artifacts — no git, no branch comparison, no history.

      ## Operating Constraints

      **APPEND-ONLY, NEVER REWRITE**: The command's **only** write is appending a new
      `## Phase N: Convergence` section to `tasks.md`. It MUST NOT:

      - modify `spec.md` or `plan.md` in any way;
      - rewrite, renumber, reorder, or delete any existing task (including tasks from a prior
        Convergence phase);
      - modify, create, or delete any application code — completing the appended tasks is the
        job of `__SPECKIT_COMMAND_IMPLEMENT__`.

      When the codebase already satisfies everything, the command MUST leave `tasks.md`
      **byte-for-byte unchanged** (no empty Convergence header) and report a clean result.

      **Constitution Authority**: The project constitution (`/memory/constitution.md`) is
      **non-negotiable**. Code that violates a MUST principle is the highest-severity finding and
      produces a corresponding remediation task. If the constitution is an unfilled template,
      skip constitution checks gracefully rather than failing.

      ## Execution Steps

      ### 1. Initialize Convergence Context

      Run `{SCRIPT}` once from repo root and parse JSON for FEATURE_DIR and AVAILABLE_DOCS. Derive absolute paths:

      - SPEC = FEATURE_DIR/spec.md
      - PLAN = FEATURE_DIR/plan.md
      - TASKS = FEATURE_DIR/tasks.md
      - CONSTITUTION = `/memory/constitution.md` (if present)
      If `spec.md`, `plan.md`, or `tasks.md` is missing, STOP with a clear, actionable message naming the
      prerequisite command to run (`__SPECKIT_COMMAND_SPECIFY__` for a missing spec, `__SPECKIT_COMMAND_PLAN__` for a missing plan,
      `__SPECKIT_COMMAND_TASKS__` for missing tasks). Do not produce partial output.
      For single quotes in args like "I'm Groot", use escape syntax: e.g 'I'\''m Groot' (or double-quote if possible: "I'm Groot").

      ### 2. Load Artifacts (Progressive Disclosure)

      Load only the minimal necessary context from each artifact:

      **From spec.md:**

      - Functional Requirements (FR-###)
      - Success Criteria (SC-###) — include only items requiring buildable work; exclude
        post-launch outcome metrics and business KPIs
      - User Stories and their Acceptance Scenarios
      - Edge Cases (if present)

      **From plan.md:**

      - Architecture/stack choices and technical decisions
      - Data Model references
      - Phases and named touch-points (files/components the plan says will be created or edited)
      - Technical constraints

      **From tasks.md:**

      - Task IDs (to compute the next ID and next phase number)
      - Descriptions, phase grouping, and referenced file paths

      **From constitution (if not an unfilled template):**

      - Principle names and MUST/SHOULD normative statements

      ### 3. Build the Intent Inventory

      Create an internal model (do not echo raw artifacts):

      - **Requirements inventory**: one stable key per FR-### / SC-### / user-story acceptance
        scenario (e.g. `US1/AC2`), plus the plan decisions and constitution principles that
        impose buildable obligations.
      - **Code-scope map**: from the file paths named in `plan.md` and `tasks.md`, plus a keyword
        search for the concepts each requirement describes, derive the set of source files and
        components in scope for assessment. Bound the assessment to these — do **not** infer
        scope beyond what the artifacts define.

      ### 4. Assess the Codebase and Classify Findings

      Include every existing task in the intent inventory, regardless of checkbox state or
      Convergence phase: completion claims are not evidence. Verify current behavior against
      the spec, plan, tasks, and constitution; for corrective task chains, assess the resulting
      behavior, not superseded implementation details. Check both unmet obligations and
      implementation that contradicts, exceeds, or falls outside the stated intent.

      For each item in the intent inventory, inspect the current code in scope and produce a
      `Finding` only where there is a gap. Classify every finding by **gap type**:

      - **`missing`**: the required work is absent from the code entirely.
      - **`partial`**: the work exists but does not yet fully satisfy the requirement /
        acceptance criterion / plan decision.
      - **`contradicts`**: the code does something that conflicts with stated intent or a
        constitution MUST principle.
      - **`unrequested`**: the code contains work not called for by the spec, plan, or tasks
        (surfaced for awareness — converge does **not** delete code, it only appends a task to
        review/justify or remove it).

      Each `Finding` records: a stable id, the `source-ref` it traces to, the `gap-type`, a
      severity, and a short human-readable description with the evidence (the file/area observed).

      **Edge cases:**

      - **Little or no code yet**: treat the entire specified scope as `missing` remaining work
        rather than failing.
      - **Nothing remains**: produce zero findings and follow the converged branch in Step 7.

      ### 5. Assign Severity

      - **CRITICAL**: violates a constitution MUST principle, or a `missing`/`contradicts` gap
        that blocks baseline functionality of a P1 user story.
      - **HIGH**: a `missing` or `partial` gap on a core functional requirement or acceptance
        criterion.
      - **MEDIUM**: a `partial` gap on a secondary requirement, or an `unrequested` addition with
        unclear justification.
      - **LOW**: minor partial gaps, polish, or low-risk `unrequested` additions.

      ### 6. Present the In-Session Findings Summary

      Before appending anything, output a compact, severity-graded summary (no file writes yet):

      ## Convergence Findings

      | ID | Gap Type | Severity | Source | Evidence | Remaining Work |
      |----|----------|----------|--------|----------|----------------|
      | F1 | missing  | HIGH     | FR-008 | Example: no append-only guard detected in path/to/module.py when writing tasks.md | Add append-only enforcement |

      **Summary metrics:**

      - Requirements / acceptance criteria checked
      - Plan decisions checked
      - Constitution principles checked (or "skipped — template")
      - Findings by gap type (missing / partial / contradicts / unrequested)
      - Findings by severity

      ### 7. Append Convergence Tasks (or report converged)

      **If there are one or more actionable findings** (`tasks_appended` outcome):

      Append to the **end** of `tasks.md`, per the append contract:

      1. Scan all existing task IDs; let `M` be the maximum. Determine the next phase number `N`
         (highest existing phase + 1).
      2. Write a single new section header `## Phase N: Convergence`.
      3. Emit one checklist item per actionable finding, ordered CRITICAL/HIGH first, assigning
         zero-padded IDs `T{M+1:03d}, T{M+2:03d}, …`:

         ```markdown
         - [ ] T042 <imperative description> per <source-ref> (<gap-type>)
         ```

         `<source-ref>` traces the task to its origin: e.g. `FR-003`, `SC-002`,
         `US1/AC2`, `plan: storage decision`, `Constitution II`.

         `<gap-type>` is one of `missing`, `partial`, `contradicts`, `unrequested`.

         Constitution-violation tasks MUST be emitted first and described as
         `CRITICAL`.
      4. Never reuse or renumber existing IDs. If a prior Convergence phase exists, add a new,
         separately-numbered one below it — do not touch the old one.

      **If there are no actionable findings** (`converged` outcome):

      - Do **not** modify `tasks.md` at all — no empty phase header.
      - Report: **"✅ Converged — the implementation satisfies the spec, plan, and tasks."**
      - Include the summary counts of what was checked.

      ### 8. Provide Next Actions (Handoff)

      - On `tasks_appended`: state how many tasks were appended under which phase, and recommend
        running `__SPECKIT_COMMAND_IMPLEMENT__` to complete them; note that a follow-up converge
        run will find fewer or no remaining items.
      - On `converged`: recommend proceeding to review / opening a PR. No further implement pass
        is needed for this feature's specified scope.

      ### 9. Check for extension hooks

      After producing the result, check if `.specify/extensions.yml` exists in the project root.

      - If it exists, read it and look for entries under the `hooks.after_converge` key
      - If the YAML cannot be parsed or is invalid, do not skip silently: tell the user that `.specify/extensions.yml` could not be read (include the parser error) and that no hooks were checked, including any mandatory (`optional: false`) hooks registered there, then continue normally
      - Filter out hooks where `enabled` is explicitly `false`. Treat hooks without an `enabled` field as enabled by default.
      - For each remaining hook, do **not** attempt to interpret or evaluate hook `condition` expressions:
        - If the hook has no `condition` field, or it is null/empty, treat the hook as executable
        - If the hook defines a non-empty `condition`, skip the hook and leave condition evaluation to the HookExecutor implementation
      - Report the convergence outcome (`converged` or `tasks_appended`) in-session before listing
        any hooks, so users can decide whether to run optional follow-up commands.
      - For each executable hook, output the following based on its `optional` flag:
        - **Optional hook** (`optional: true`):

          ```text
          ## Extension Hooks

          **Optional Hook**: {extension}
          Command: `/{command}`
          Description: {description}

          Prompt: {prompt}
          To execute: `/{command}`
          ```

        - **Mandatory hook** (`optional: false`):

          ```text
          ## Extension Hooks

          **Automatic Hook**: {extension}
          Executing: `/{command}`
          EXECUTE_COMMAND: {command}
          ```
          After emitting the block above you MUST actually invoke the hook and wait for it to finish before continuing. Run it the same way you would run the command yourself in this agent/session (the invocation may differ from the literal `{command}` id shown above, e.g. a skills-mode agent runs it as `/skill:speckit-...` or `$speckit-...`). Emitting the block alone does not run the hook.

      - If no hooks are registered or `.specify/extensions.yml` does not exist, skip silently
